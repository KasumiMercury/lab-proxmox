[defaults]
host_key_checking = False
inventory = inventory/
timeout = 30
retry_files_enabled = False
stdout_callback = default
deprecation_warnings = False
ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PreferredAuthentications=password,publickey
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
