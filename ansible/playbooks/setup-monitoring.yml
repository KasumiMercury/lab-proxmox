---
# Proxmox metrics: VictoriaMetrics + Grafana on the NAS (strix), and a vmagent on every Proxmox node
# that scrapes node_exporter, prometheus-pve-exporter and the Ceph mgr locally and pushes to strix.
# Push only, because the router lets 192.168.20.0/24 reach strix but not the other way round.
# Run with: task monitoring:setup  (asks for the strix sudo password)

- name: Setup metrics storage and Grafana
  hosts: nas
  become: true
  roles:
    - monitoring_server

- name: Setup metric collection on Proxmox nodes
  hosts: pve
  roles:
    - role: pve_monitoring
      vars:
        pve_monitoring_remote_write_url: "http://{{ hostvars['strix'].lan_address }}:8428/api/v1/write"
