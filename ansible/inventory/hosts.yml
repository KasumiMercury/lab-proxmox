---
# Hosts that are not created by Terraform (Proxmox nodes and the NAS).
# Used by `task monitoring:setup`; the Terraform environments keep their generated <env>.ini.
all:
  children:
    pve:
      vars:
        ansible_user: root
      hosts:
        hod:
          ansible_host: 192.168.20.10
        yesod:
          ansible_host: 192.168.20.20
        netzach:
          ansible_host: 192.168.20.30
    nas:
      hosts:
        strix:
          # Reached over Tailscale (MagicDNS); sudo needs a password (-K)
          ansible_host: strix
          ansible_user: mercury
          # LAN address the Proxmox nodes push metrics to (192.168.20.0/24 -> 192.168.110.0/24 is routed,
          # the reverse direction is blocked by the router)
          lan_address: 192.168.110.5
