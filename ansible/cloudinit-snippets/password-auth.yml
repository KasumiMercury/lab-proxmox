#cloud-config
# Vendor-data snippet for Proxmox VMs created by this repository.
#
# Attach it with cicustom "vendor=strix0:snippets/password-auth.yml"
# (Terraform: cloudinit_vendor_snippet = "strix0:snippets/password-auth.yml").
# Upload: task pve:snippet HOST=user@hod  (-> /mnt/pve/strix0/snippets/, shared NFS)
# Proxmox keeps generating the user-data from ciuser / cipassword / sshkeys;
# this file only adds SSH policy on top of it.
#
# Do NOT attach it as "user=": that replaces the generated user-data, and the
# Terraform-managed user, password and SSH key would be lost.

ssh_pwauth: true
disable_root: true
