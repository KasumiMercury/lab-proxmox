---
# One network device (zabbix_snmp_host): created when missing, otherwise its SNMP interface,
# host group and templates are brought in line. Other changes made in the UI are left alone.
- name: Look up {{ zabbix_snmp_host.name }}
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    headers: "{{ zabbix_api_headers }}"
    body:
      jsonrpc: "2.0"
      method: host.get
      id: 1
      params:
        output: [hostid, name]
        filter: { host: "{{ zabbix_snmp_host.name }}" }
        selectInterfaces: [interfaceid, type, main, ip, port, details]
        selectHostGroups: [groupid]
        selectParentTemplates: [templateid]
  register: zabbix_snmp_existing
  failed_when: zabbix_snmp_existing.json.error is defined

- name: Build the desired state of {{ zabbix_snmp_host.name }}
  ansible.builtin.set_fact:
    zabbix_snmp_templateids: >-
      {{ zabbix_snmp_templates.json.result | selectattr('host', 'in', zabbix_snmp_host.templates)
         | map(attribute='templateid') | sort }}
    zabbix_snmp_interface:
      type: 2
      main: 1
      useip: 1
      ip: "{{ zabbix_snmp_host.ip }}"
      dns: ""
      port: "161"
      details: { version: 2, bulk: 1, community: "{$SNMP_COMMUNITY}" }

- name: Create {{ zabbix_snmp_host.name }}
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    headers: "{{ zabbix_api_headers }}"
    body:
      jsonrpc: "2.0"
      method: host.create
      id: 1
      params:
        host: "{{ zabbix_snmp_host.name }}"
        name: "{{ zabbix_snmp_host.visible_name | default(zabbix_snmp_host.name) }}"
        groups: [{ groupid: "{{ zabbix_snmp_groupid }}" }]
        templates: "{{ zabbix_snmp_templateids | map('community.general.dict_kv', 'templateid') }}"
        interfaces: "{{ [zabbix_snmp_interface] }}"
        macros: "{{ zabbix_snmp_host.macros | default({}) | dict2items(key_name='macro', value_name='value') }}"
  register: zabbix_snmp_create
  failed_when: zabbix_snmp_create.json.error is defined
  changed_when: true
  when: zabbix_snmp_existing.json.result | length == 0

- name: Update {{ zabbix_snmp_host.name }}
  when: zabbix_snmp_existing.json.result | length > 0
  vars:
    current: "{{ zabbix_snmp_existing.json.result[0] }}"
    current_snmp: "{{ current.interfaces | selectattr('type', 'equalto', '2') | selectattr('main', 'equalto', '1') | list }}"
  block:
    # host.update replaces the linked templates (unlinking the others, keeping their items)
    - name: Update the host group and templates of {{ zabbix_snmp_host.name }}
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        headers: "{{ zabbix_api_headers }}"
        body:
          jsonrpc: "2.0"
          method: host.update
          id: 1
          params:
            hostid: "{{ current.hostid }}"
            groups: "{{ (current.hostgroups | map(attribute='groupid') | list + [zabbix_snmp_groupid]) | unique | map('community.general.dict_kv', 'groupid') }}"
            templates: "{{ zabbix_snmp_templateids | map('community.general.dict_kv', 'templateid') }}"
      register: zabbix_snmp_update
      failed_when: zabbix_snmp_update.json.error is defined
      changed_when: true
      when: >-
        zabbix_snmp_groupid not in current.hostgroups | map(attribute='groupid')
        or current.parentTemplates | map(attribute='templateid') | sort != zabbix_snmp_templateids

    - name: Create the SNMP interface of {{ zabbix_snmp_host.name }}
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        headers: "{{ zabbix_api_headers }}"
        body: { jsonrpc: "2.0", method: hostinterface.create, id: 1, params: "{{ zabbix_snmp_interface | combine({'hostid': current.hostid}) }}" }
      register: zabbix_snmp_interface_create
      failed_when: zabbix_snmp_interface_create.json.error is defined
      changed_when: true
      when: current_snmp | length == 0

    - name: Update the SNMP interface of {{ zabbix_snmp_host.name }}
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        headers: "{{ zabbix_api_headers }}"
        body:
          jsonrpc: "2.0"
          method: hostinterface.update
          id: 1
          params: "{{ zabbix_snmp_interface | combine({'interfaceid': current_snmp[0].interfaceid}) }}"
      register: zabbix_snmp_interface_update
      failed_when: zabbix_snmp_interface_update.json.error is defined
      changed_when: true
      when: >-
        current_snmp | length > 0
        and (current_snmp[0].ip != zabbix_snmp_host.ip or current_snmp[0].port != '161'
             or current_snmp[0].details.version != '2' or current_snmp[0].details.community != '{$SNMP_COMMUNITY}')

# Host macros of existing hosts (new hosts got them in host.create)
- name: Set the host macros of {{ zabbix_snmp_host.name }}
  when: zabbix_snmp_existing.json.result | length > 0 and zabbix_snmp_host.macros | default({}) | length > 0
  vars:
    hostid: "{{ zabbix_snmp_existing.json.result[0].hostid }}"
  block:
    - name: Look up the host macros of {{ zabbix_snmp_host.name }}
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        headers: "{{ zabbix_api_headers }}"
        body: { jsonrpc: "2.0", method: usermacro.get, id: 1, params: { output: [hostmacroid, macro, value], hostids: ["{{ hostid }}"] } }
      register: zabbix_snmp_macros
      failed_when: zabbix_snmp_macros.json.error is defined

    - name: Create or update the host macros of {{ zabbix_snmp_host.name }}
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        headers: "{{ zabbix_api_headers }}"
        body:
          jsonrpc: "2.0"
          method: "{{ 'usermacro.update' if current else 'usermacro.create' }}"
          id: 1
          params: >-
            {{ {'value': item.value}
               | combine({'hostmacroid': current[0].hostmacroid} if current else {'hostid': hostid, 'macro': item.key}) }}
      register: zabbix_snmp_macro_set
      failed_when: zabbix_snmp_macro_set.json.error is defined
      changed_when: true
      when: current | length == 0 or current[0].value != item.value | string
      vars:
        current: "{{ zabbix_snmp_macros.json.result | selectattr('macro', 'equalto', item.key) | list }}"
      loop: "{{ zabbix_snmp_host.macros | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
