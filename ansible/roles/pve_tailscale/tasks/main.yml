---
# Installs tailscaled only. Joining the tailnet needs a login in the browser, once per node:
#   tailscale up --accept-dns=false   (then disable key expiry for the node in the admin console)
- name: Install the Tailscale archive key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add the Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: |
      # Tailscale packages for debian {{ ansible_distribution_release }}
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
    state: present

- name: Start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
