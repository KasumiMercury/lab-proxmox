---
# Debian reads the first value of each keyword, and sshd_config includes sshd_config.d/*.conf at the top,
# so this drop-in wins over the stock "PermitRootLogin yes". Root keeps key login: PVE uses it between nodes.
- name: Restrict SSH to key authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
    mode: "0644"
  notify: reload ssh

# A broken config fails here, before the handler reloads sshd
- name: Check the SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

# Only Debian security updates run unattended; Proxmox and Ceph packages stay manual (apt full-upgrade).
# "#clear" drops the stock list, which also allows Debian stable point releases.
- name: Limit unattended upgrades to Debian security
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Enable the daily unattended upgrade run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
