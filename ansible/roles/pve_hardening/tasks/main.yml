---
# Debian reads the first value of each keyword, and sshd_config includes sshd_config.d/*.conf at the top,
# so this drop-in wins over the stock "PermitRootLogin yes". Root keeps key login: PVE uses it between nodes.
- name: Restrict SSH to key authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
    mode: "0644"
  notify: reload ssh

# A broken config fails here, before the handler reloads sshd
- name: Check the SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Fetch the GitHub keys
  ansible.builtin.uri:
    url: "{{ pve_hardening_github_keys_url }}"
    return_content: true
  register: pve_hardening_github_keys
  check_mode: false
  run_once: true

- name: Check the GitHub keys
  ansible.builtin.assert:
    that: pve_hardening_github_keys.content is match('(ssh-|ecdsa-|sk-)')
    fail_msg: "{{ pve_hardening_github_keys_url }} returned no SSH keys"
  run_once: true

- name: Keep the GitHub keys in root's authorized_keys
  ansible.builtin.blockinfile:
    path: /etc/pve/priv/authorized_keys
    marker: "# {mark} GitHub keys ({{ pve_hardening_github_keys_url }})"
    block: "{{ pve_hardening_github_keys.content | trim }}"
  run_once: true

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

# Only Debian security updates run unattended; Proxmox and Ceph packages stay manual (apt full-upgrade).
# "#clear" drops the stock list, which also allows Debian stable point releases.
- name: Limit unattended upgrades to Debian security
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Enable the daily unattended upgrade run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
