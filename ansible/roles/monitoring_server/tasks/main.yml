---
- name: Check Docker Compose
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Require the secrets
  ansible.builtin.assert:
    that:
      - tailscale_oauth_client_secret | length > 0
      - grafana_slack_bot_token | length > 0
    fail_msg: >-
      vault_tailscale_oauth_client_secret and vault_slack_bot_token must be set
      (ansible-vault edit inventory/host_vars/strix/vault.yml)
  no_log: true

# The host itself is on the tailnet; its MagicDNS suffix names the sidecar node too
- name: Read the tailnet DNS suffix
  ansible.builtin.command: tailscale status --self --json
  register: tailscale_self
  changed_when: false

- name: Set the Grafana URL
  ansible.builtin.set_fact:
    grafana_root_url: "https://{{ grafana_tailscale_hostname }}.{{ (tailscale_self.stdout | from_json).MagicDNSSuffix }}/"

- name: Create the project directories
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: root
    mode: "0755"
  loop:
    - { path: "" }
    - { path: data/victoriametrics }
    # The Grafana image runs as uid 472
    - { path: data/grafana, owner: "472" }
    - { path: grafana/provisioning/datasources }
    - { path: grafana/provisioning/dashboards }
    - { path: grafana/provisioning/alerting }
    - { path: grafana/dashboards }
    - { path: tailscale/state }
    - { path: tailscale/config }
  loop_control:
    label: "{{ monitoring_dir }}/{{ item.path }}"

- name: Write the Grafana secrets
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ monitoring_dir }}/grafana.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Provision the VictoriaMetrics data source
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/victoriametrics.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart grafana

- name: Provision the dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart grafana

# Alerting provisioning is only read at startup. The contact point holds the bot token, hence
# readable by the Grafana image's user (472, group root) only.
- name: Provision the Slack contact point and notification policy
  ansible.builtin.template:
    src: alerting-slack.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/alerting/slack.yml"
    owner: "472"
    group: root
    mode: "0640"
  no_log: true
  notify: restart grafana

- name: Provision the alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/alerting/rules.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart grafana

- name: Download dashboards from grafana.com
  ansible.builtin.uri:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download"
    return_content: true
  register: grafana_dashboard_downloads
  loop: "{{ grafana_dashboards }}"
  loop_control:
    label: "{{ item.id }} rev {{ item.revision }}"

# Grafana reloads changed files by itself (updateIntervalSeconds)
- name: Write dashboards
  ansible.builtin.copy:
    content: >-
      {{ item.content | replace('${' ~ item.item.datasource_input ~ '}', 'victoriametrics')
         if item.item.datasource_input is defined else item.content }}
    dest: "{{ monitoring_dir }}/grafana/dashboards/{{ item.item.file }}.json"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ grafana_dashboard_downloads.results }}"
  loop_control:
    label: "{{ item.item.file }}.json"

- name: Write the Tailscale auth key
  ansible.builtin.template:
    src: tailscale.env.j2
    dest: "{{ monitoring_dir }}/tailscale.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Picked up by the container without a restart (TS_SERVE_CONFIG is watched)
- name: Write the Tailscale serve config
  ansible.builtin.template:
    src: serve.json.j2
    dest: "{{ monitoring_dir }}/tailscale/config/serve.json"
    owner: root
    group: root
    mode: "0644"

- name: Write compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ monitoring_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Start the monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    pull: missing

# Grafana used to be served by the host's tailscaled; the host is left for SSH only
- name: Read the host's tailscale serve config
  ansible.builtin.command: tailscale serve status --json
  register: tailscale_host_serve
  changed_when: false

- name: Stop serving Grafana from the host
  ansible.builtin.command: tailscale serve --https=443 off
  when: "'http://127.0.0.1:3000' in tailscale_host_serve.stdout"

- name: Show the Grafana URL
  ansible.builtin.debug:
    msg: "Grafana: {{ grafana_root_url }}"
