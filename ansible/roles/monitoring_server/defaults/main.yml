---
# Docker Compose project (same /srv/<service> layout as the other services on strix)
monitoring_dir: /srv/monitoring

# renovate: datasource=docker depName=victoriametrics/victoria-metrics
victoriametrics_version: v1.153.0
victoriametrics_image: "victoriametrics/victoria-metrics:{{ victoriametrics_version }}"
victoriametrics_retention: 1y
# Remote write endpoint for the vmagents on the Proxmox nodes (plus 127.0.0.1 for debugging)
victoriametrics_listen_address: "{{ lan_address }}"

# renovate: datasource=docker depName=grafana/grafana
grafana_version: 13.2.3
grafana_image: "grafana/grafana:{{ grafana_version }}"
# Only used when Grafana initializes its database (first start); change it in the UI afterwards.
# Generated once on the controller and kept in the gitignored artifacts directory.
grafana_admin_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/../artifacts/strix-grafana-admin-password chars=ascii_letters,digits length=24') }}"
# Dashboards from grafana.com, provisioned into the "Proxmox" folder (read-only in the UI).
# Revisions are bumped by Renovate (custom datasource "grafana-dashboards" in renovate.json);
# keep the "{ id: ..., revision: ..., file: ..." order it matches.
# datasource_input: the __inputs name to point at the VictoriaMetrics data source; only for
# dashboards that use an import-time input instead of a data source variable.
grafana_dashboards:
  - { id: 10347, revision: 5, file: proxmox, datasource_input: DS_PROMETHEUS }
  - { id: 1860, revision: 45, file: node-exporter-full }
  - { id: 2842, revision: 18, file: ceph-cluster }

# Grafana is published on the tailnet as its own node (https://<hostname>.<tailnet>.ts.net) by a
# Tailscale container next to it, so the services on strix (Grafana, later Zabbix) get separate
# names and the host's tailscaled stays untouched. "grafana" is taken by the k8s Grafana.
grafana_tailscale_hostname: pve-grafana
# renovate: datasource=docker depName=tailscale/tailscale
tailscale_version: v1.102.5
tailscale_image: "tailscale/tailscale:{{ tailscale_version }}"
# OAuth client (scope auth_keys, tag below) shared by the Tailscale containers on strix;
# the secret is in inventory/host_vars/strix/vault.yml
tailscale_oauth_client_secret: "{{ vault_tailscale_oauth_client_secret | default('') }}"
tailscale_tags: tag:strix

# Alerts: rules on the VictoriaMetrics data (templates/alert-rules.yml.j2, in the "Proxmox" folder,
# read-only in the UI) sent to Slack with the bot token of the Slack App shared with Zabbix (role
# zabbix_server; scope chat:write, the bot invited to the channel). Zabbix already alerts on the Linux
# side of the nodes (CPU, memory, file systems, temperatures, agent down) and the network devices,
# so these cover what only the metrics here show: the Proxmox cluster, Ceph and the metric pipeline.
grafana_slack_bot_token: "{{ vault_slack_bot_token | default('') }}"
grafana_slack_channel: "#pve-alert"
# Guests (Proxmox name, regex) expected to be running; the others are started and stopped by hand
grafana_alert_running_guests: k8s-.*|gnosis|athanor
# Used share of a Proxmox storage / of a Ceph pool (its max_avail already accounts for replication)
grafana_alert_storage_usage: 0.85
grafana_alert_ceph_pool_usage: 0.75
