---
- name: Add the Zabbix repository
  ansible.builtin.deb822_repository:
    name: zabbix
    uris: "{{ zabbix_agent_repo_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: "{{ zabbix_agent_repo_key_url }}"
  register: zabbix_agent_repo

- name: Install Zabbix agent 2 and lm-sensors
  ansible.builtin.apt:
    name: [zabbix-agent2, lm-sensors]
    update_cache: "{{ zabbix_agent_repo is changed }}"

- name: Write the agent configuration
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart zabbix-agent2

- name: Add the lm-sensors user parameter
  ansible.builtin.template:
    src: lmsensors.conf.j2
    dest: /etc/zabbix/zabbix_agent2.d/lmsensors.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart zabbix-agent2

- name: Enable Zabbix agent 2
  ansible.builtin.systemd_service:
    name: zabbix-agent2
    enabled: true
    state: started
