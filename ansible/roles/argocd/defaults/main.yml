---
# ArgoCD bootstrap. Ansible installs the chart only when ArgoCD is absent (fresh cluster); afterwards
# ArgoCD manages itself from its own repository (root Application is applied manually for now).
argocd_namespace: argocd
argocd_helm_repo: https://argoproj.github.io/argo-helm
# Chart argo/argo-cd 10.8.1 ships Argo CD v3.5.2 (tested with Kubernetes 1.33-1.36)
argocd_chart_version: "10.8.1"
# Helm values passed at bootstrap (kept minimal; day-2 settings belong to the ArgoCD repo).
# Self-management later requires the ServerSideApply=true sync option on the ArgoCD Application.
argocd_helm_values: {}
# Seconds to wait for the ArgoCD components to roll out
argocd_ready_timeout: 600
