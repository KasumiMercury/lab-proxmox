---
# ArgoCD bootstrap. Ansible installs the chart only when ArgoCD is absent (fresh cluster); afterwards
# ArgoCD manages itself from its own repository (root Application is applied manually for now).
argocd_namespace: argocd
argocd_helm_repo: https://argoproj.github.io/argo-helm
# Chart argo/argo-cd; check its Kubernetes support when bumping (lab-argo then takes over the version)
# renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
argocd_chart_version: "10.8.1"
# Helm values passed at bootstrap (kept minimal; day-2 settings belong to the ArgoCD repo).
# Self-management later requires the ServerSideApply=true sync option on the ArgoCD Application.
# The Application health check is set here too, so the sync waves of the root app-of-apps already wait
# for each component on the very first sync. Keep it identical to platform/argocd/values.yaml in lab-argo.
argocd_helm_values:
  configs:
    params:
      # TLS is terminated in front of argocd-server (Tailscale Ingress in the ArgoCD repo), so it serves plain HTTP
      server.insecure: true
    cm:
      # https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
# Seconds to wait for the ArgoCD components to roll out
argocd_ready_timeout: 600
