---
# Where vmagent pushes (Prometheus remote write). Set by playbooks/setup-monitoring.yml from the nas host.
pve_monitoring_remote_write_url: ""
pve_monitoring_scrape_interval: 30s
# Where systemd-journal-upload pushes the journal (VictoriaLogs journald endpoint, without /upload).
# Set by playbooks/setup-monitoring.yml from the nas host.
pve_monitoring_journal_upload_url: ""

# vmagent buffers on disk while the remote write target is unreachable (e.g. strix rebooting),
# and sends the backlog once it is back. Oldest data is dropped beyond this size.
# The archive is verified against the release's _checksums.txt, so a version bump needs no hash
# renovate: datasource=github-releases depName=VictoriaMetrics/VictoriaMetrics
vmagent_version: v1.153.0
vmagent_max_disk_usage: 1GiB
# Cache limit; the default (60% of RAM) is far beyond what a few local targets need,
# and the nodes are short on memory
vmagent_memory_allowed: 256MiB

# Not packaged for Debian trixie, so it is installed from PyPI into a venv
# renovate: datasource=pypi depName=prometheus-pve-exporter
pve_exporter_version: 3.10.1
pve_exporter_dir: /opt/prometheus-pve-exporter
pve_exporter_config: /etc/prometheus/pve.yml
# Read-only API user (PVEAuditor on /) and its token
pve_exporter_api_user: prometheus@pve
pve_exporter_token_name: exporter
