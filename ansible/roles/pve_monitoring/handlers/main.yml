---
- name: restart node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

- name: restart pve_exporter
  ansible.builtin.systemd:
    name: prometheus-pve-exporter
    state: restarted
    daemon_reload: true

- name: restart vmagent
  ansible.builtin.systemd:
    name: vmagent
    state: restarted
    daemon_reload: true

- name: reload vmagent
  ansible.builtin.systemd:
    name: vmagent
    state: reloaded
