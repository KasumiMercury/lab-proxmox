---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted

- name: restart otel-collector
  ansible.builtin.command: docker compose restart otel-collector
  args:
    chdir: "{{ arcane_dir }}"
