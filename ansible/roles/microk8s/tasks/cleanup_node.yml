---
# Runs on every cluster node after the workers joined (play should use serial: 1).
# Each node first comes up as a standalone MicroK8s with Calico and kube-proxy, which leaves the vxlan.calico
# device, Calico routes and iptables rules behind, in both the legacy and the nft tables. A reboot clears them all;
# the CNI and kube-proxy settings already on disk keep them from coming back.
# The same reboot also boots a kernel installed by main.yml (microk8s_kernel_package).

- name: Load the shared Cilium values
  ansible.builtin.set_fact:
    cilium_values: "{{ lookup('ansible.builtin.file', cilium_config_dir ~ '/values.yaml') | from_yaml }}"
  when: microk8s_cni == "cilium"
  tags: [microk8s, cilium, cleanup]

# KUBE-SERVICES is written by kube-proxy only (kubelet keeps its own KUBE-FIREWALL / KUBE-KUBELET-CANARY)
- name: Look for Calico and kube-proxy leftovers
  ansible.builtin.shell: |
    ip link show vxlan.calico >/dev/null 2>&1 && echo "link vxlan.calico"
    for save in iptables-legacy-save iptables-nft-save ip6tables-legacy-save ip6tables-nft-save; do
      $save 2>/dev/null | grep -qE '^:({{ cleanup_chain_pattern }})' && echo "$save"
    done
    true
  vars:
    cleanup_chain_pattern: "{{ 'cali-|KUBE-SERVICES' if (cilium_values.kubeProxyReplacement | default(false) | bool) else 'cali-' }}"
  register: microk8s_leftovers
  changed_when: false
  when: microk8s_cni == "cilium"
  tags: [microk8s, cilium, cleanup]

- name: Look for a newer installed kernel than the running one
  ansible.builtin.shell: |
    installed=$(readlink -f /boot/vmlinuz | sed 's|.*/vmlinuz-||')
    [ "$installed" = "$(uname -r)" ] || echo "kernel $(uname -r) -> $installed"
  register: microk8s_kernel_pending
  changed_when: false
  tags: [microk8s, cleanup, kernel]

- name: Reboot to clear the leftovers or boot the new kernel
  when: >-
    (microk8s_cni == "cilium" and microk8s_leftovers.stdout | length > 0)
    or microk8s_kernel_pending.stdout | length > 0
  tags: [microk8s, cilium, cleanup, kernel]
  block:
    - name: Show what was found
      ansible.builtin.debug:
        msg: "{{ (microk8s_leftovers.stdout_lines | default([])) + microk8s_kernel_pending.stdout_lines }}"

    - name: Reboot the node
      ansible.builtin.reboot:
        reboot_timeout: "{{ microk8s_ready_timeout }}"

    - name: Wait for MicroK8s to be ready on this node
      ansible.builtin.command: microk8s status --wait-ready --timeout {{ microk8s_ready_timeout }}
      changed_when: false

    - name: Wait for the node to become Ready
      ansible.builtin.command: >
        microk8s kubectl wait --for=condition=Ready node/{{ ansible_hostname }} --timeout={{ microk8s_ready_timeout }}s
      changed_when: false
      delegate_to: "{{ groups[microk8s_control_plane_group][0] }}"

    - name: Wait for the Cilium agent on this node
      ansible.builtin.command: >
        microk8s kubectl -n kube-system wait --for=condition=Ready pod -l k8s-app=cilium
        --field-selector spec.nodeName={{ ansible_hostname }} --timeout={{ microk8s_ready_timeout }}s
      register: microk8s_cilium_ready
      until: microk8s_cilium_ready.rc == 0
      retries: 3
      delay: 10
      changed_when: false
      delegate_to: "{{ groups[microk8s_control_plane_group][0] }}"
