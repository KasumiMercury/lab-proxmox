---
# Runs on every cluster node: install MicroK8s and make nodes resolvable by name.

- name: Install the node kernel
  ansible.builtin.apt:
    name: "{{ microk8s_kernel_package }}"
    state: present
  when: microk8s_kernel_package | length > 0
  tags: [microk8s, packages, kernel]

- name: Ensure snapd is installed
  ansible.builtin.apt:
    name: snapd
    state: present
  tags: [microk8s, packages]

- name: Install MicroK8s from snap
  community.general.snap:
    name: microk8s
    classic: true
    channel: "{{ microk8s_channel }}"
  tags: [microk8s, packages]

- name: Allow the Ansible user to run microk8s without sudo
  ansible.builtin.user:
    name: "{{ ansible_user | default(ansible_user_id) }}"
    groups: microk8s
    append: true
  tags: [microk8s]

# cloud-init (manage_etc_hosts: true in the Proxmox user-data) rebuilds /etc/hosts from the template on
# every boot, so the same block goes into the template to survive reboots
- name: Register every cluster node in /etc/hosts
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} MicroK8s cluster nodes (Ansible managed)"
    block: |
      {% for host in groups[microk8s_cluster_group] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
  loop:
    - /etc/hosts
    - /etc/cloud/templates/hosts.debian.tmpl
  tags: [microk8s, hosts]

- name: Wait for MicroK8s to be ready on this node
  ansible.builtin.command: microk8s status --wait-ready --timeout {{ microk8s_ready_timeout }}
  changed_when: false
  tags: [microk8s]

- name: Prepare this node for Cilium
  ansible.builtin.include_tasks: cilium_node.yml
  when: microk8s_cni == "cilium"
  tags: [microk8s, cilium]
