---
# Snap channel to install (pin a track for reproducible clusters)
microk8s_channel: "1.36/stable"
# Addons enabled on the control plane after bootstrap
microk8s_addons:
  - dns
# Inventory groups (generated by ansible/scripts/generate_inventory.sh from the VM "role")
microk8s_cluster_group: k8s
microk8s_control_plane_group: k8s_control_plane
microk8s_worker_group: k8s_worker
# Where the cluster kubeconfig is saved on the Ansible controller (gitignored)
microk8s_kubeconfig_dest: "{{ playbook_dir }}/../artifacts/{{ microk8s_cluster_group }}.kubeconfig"
# Seconds to wait for microk8s / nodes to become ready
microk8s_ready_timeout: 600

# CNI: "cilium" (bootstrapped with the bundled Helm, replaces the default Calico) or "calico" (MicroK8s default)
microk8s_cni: cilium
microk8s_snap_data: /var/snap/microk8s/current

# Cilium bootstrap. Chart pin and values come from the shared cilium/ directory (future git submodule,
# also consumed by the ArgoCD repo). Ansible installs Cilium only when it is absent (fresh cluster);
# every later change is managed by ArgoCD and is out of scope here.
cilium_config_dir: "{{ playbook_dir }}/../../cilium"
