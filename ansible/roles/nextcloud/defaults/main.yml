---
# Nextcloud tree (code, config, apps, data) on the mp0 volume, bind mounted to the web root.
# The web root stays /var/www/html as in the Docker image: datadirectory and the
# storage ids in the database ("local::/var/www/html/data/") depend on that path.
nextcloud_volume_dir: /mnt/monad/nextcloud
nextcloud_webroot: /var/www/html

# Release of the Nextcloud code; when it differs from the running one the role upgrades the tree
# (tasks/upgrade.yml). Only one major at a time, and check the PHP and PostgreSQL support first.
# renovate: datasource=github-releases depName=nextcloud/server
nextcloud_version: 34.0.4
# The Proxmox node (yesod) and container id of this CT, for the snapshot taken before an upgrade.
# An address, not an inventory name: task ansible:run only loads the generated nextcloud.ini.
nextcloud_pve_host: 192.168.20.20
nextcloud_pve_vmid: 102

# Public URL, served by "tailscale serve" (HTTPS terminated by Tailscale)
nextcloud_domain: athanor.tail4a681d.ts.net

# Hour (UTC) when heavy daily background jobs may start; 19 = 04:00 JST
nextcloud_maintenance_window_start: 19

nextcloud_php_version: "8.3"
nextcloud_php_memory_limit: 512M
nextcloud_php_upload_limit: 512M

# PostgreSQL from the PGDG repository; the major version matches the old postgres container
nextcloud_pg_version: 18

# renovate: datasource=deb depName=tailscale registryUrl=https://pkgs.tailscale.com/stable/ubuntu?suite=noble&components=main&binaryArch=amd64
nextcloud_tailscale_version: 1.104.1
nextcloud_db_name: nextcloud
# dbuser in config.php (created by the Nextcloud installer; owns every table)
nextcloud_db_user: oc_admin

# false = install and configure only, keep tailscaled and the cron timer stopped
# (used while the old athanor still holds the same Tailscale node)
nextcloud_services_enabled: true
