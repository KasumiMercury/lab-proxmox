version: '3'

tasks:
  push-secrets:
    desc: "Encodes JSON file and push it to GitHub Actions secrets"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      DATA:
        sh: cat {{.CLI_ARGS}}
      FILE_NAME: "{{base .CLI_ARGS}}"
      ENCODED: "{{ b64enc .DATA }}"
      SECRET_NAME: "{{.FILE_NAME | replace \".tfvars.json\" \"\" | replace \".auto\" \"\" | replace \" \" \"_\" | replace \"-\" \"_\" | replace \".\" \"_\" | upper}}"
    cmds:
      - echo "{{ .SECRET_NAME }}"
      - task: warning
      - gh secret set {{ .SECRET_NAME }} --body {{ .ENCODED }}

  warning:
    prompt: "Are you sure?"

  push-secret-tfvars-json:
    aliases:
      - push
    desc: "Encodes the content of all files ending with tfvars.json in the specified directory"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      FILES:
        sh: find {{.CLI_ARGS}} -name "*tfvars.json" -type f -print
    cmds:
      - for: { var: FILES, split: "\n" }
        task: push-secrets
        vars:
          CLI_ARGS: "{{.ITEM}}"

  gpg-encrypt-file:
    desc: "Encrypts tfvars.json file with GPG"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      TARGET_FILE: "{{.CLI_ARGS}}"
    dotenv: ['.env']
    cmds:
      - |
        PASS="${GPG_PASS:-}"
        if [ -z "$PASS" ]; then
          printf 'Enter GPG passphrase: ' >&2; stty -echo; IFS= read -r PASS; stty echo; echo >&2
          printf 'Confirm GPG passphrase: ' >&2; stty -echo; IFS= read -r CONFIRM; stty echo; echo >&2
          if [ "$PASS" != "$CONFIRM" ]; then
            echo 'Passphrases do not match.' >&2
            exit 1
          fi
        fi
        printf '%s' "$PASS" | gpg --symmetric --cipher-algo AES256 --output {{ .TARGET_FILE }}.gpg --batch --yes --passphrase-fd 0 {{ .TARGET_FILE }}
        unset PASS CONFIRM
        echo 'Encrypted file : {{ .TARGET_FILE }}.gpg'

  encrypt-tfvars-json:
    aliases:
      - encrypt
    desc: "Encrypts the content of all files ending with tfvars.json in the specified directory"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      FILES:
        sh: find {{.CLI_ARGS}} -name "*tfvars.json" -type f -print
    cmds:
      - for: { var: FILES, split: "\n" }
        task: gpg-encrypt-file
        vars:
          CLI_ARGS: "{{.ITEM}}"

  gpg-decrypt-file:
    desc: "Decrypts a *.gpg file with GPG (output: path without .gpg suffix)"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      TARGET_FILE: "{{.CLI_ARGS}}"
      OUTPUT_FILE: "{{ .CLI_ARGS | trimSuffix \".gpg\" }}"
    dotenv: ['.env']
    cmds:
      - |
        if [ ! -f "{{ .TARGET_FILE }}" ]; then
          echo 'File not found: {{ .TARGET_FILE }}' >&2
          exit 1
        fi
        case "{{ .TARGET_FILE }}" in
          *.gpg) ;;
          *) echo 'Target file must end with .gpg: {{ .TARGET_FILE }}' >&2; exit 1 ;;
        esac
        PASS="${GPG_PASS:-}"
        if [ -z "$PASS" ]; then
          printf 'Enter GPG passphrase: ' >&2; stty -echo; IFS= read -r PASS; stty echo; echo >&2
        fi
        printf '%s' "$PASS" | gpg --decrypt --output {{ .OUTPUT_FILE }} --batch --yes --passphrase-fd 0 {{ .TARGET_FILE }}
        unset PASS
        chmod 0600 {{ .OUTPUT_FILE }}
        echo 'Decrypted file : {{ .OUTPUT_FILE }}'

  decrypt-tfvars-json:
    aliases:
      - decrypt
    desc: "Decrypts all files ending with tfvars.json.gpg in the specified directory"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      FILES:
        sh: find {{.CLI_ARGS}} -name "*tfvars.json.gpg" -type f -print
    cmds:
      - for: { var: FILES, split: "\n" }
        task: gpg-decrypt-file
        vars:
          CLI_ARGS: "{{.ITEM}}"
