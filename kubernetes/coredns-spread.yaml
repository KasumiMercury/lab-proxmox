# Applied over Talos' CoreDNS Deployment by bootstrap.sh (server-side apply, field manager lab-bootstrap).
# The PDB lives in lab-argo (platform/coredns)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              k8s-app: kube-dns
