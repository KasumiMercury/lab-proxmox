# Argo CD bootstrap (kubernetes/bootstrap.sh). Installed only when Argo CD is absent (fresh cluster); afterwards
# Argo CD manages itself from lab-argo (platform/argocd), which then takes over the chart version.
repo: https://argoproj.github.io/argo-helm
chart: argo-cd
# Check its Kubernetes support when bumping
# renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
version: "10.10.2"
# Kept minimal: day-2 settings belong to lab-argo. Keep identical to platform/argocd/values.yaml there, so the
# hand-over shows no diff. The Application health check is set here too, so the sync waves of the root
# app-of-apps already wait for each component on the very first sync.
values:
  configs:
    params:
      # TLS is terminated in front of argocd-server (Tailscale Ingress in lab-argo), so it serves plain HTTP
      server.insecure: true
    cm:
      # https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
