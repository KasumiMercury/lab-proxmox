name: Terraform Lint and Plan
on:
    pull_request:
        branches:
            - production
    workflow_dispatch:
      inputs:
        target_env:
          description: "Target environment"
          required: false
          default: "all"

jobs:
    Lint:
        name: Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Cache Plugin Directory
              uses: actions/cache@v4
              with:
                path: ~/.tflint.d/plugins
                key: ${{ runner.os }}-tflint-${{ hashFiles('terraform/.tflint.hcl') }}

            - name: Set up TFlint
              uses: terraform-linters/setup-tflint@v4
              with:
                tflint_version: v0.57.0
            - name: Show version
              run: tflint --version
            
            - name: Init TFlint
              run: tflint --init
              env:
                GITHUB_TOKEN: ${{ github.token }}

            - name: Run TFlint
              run: tflint --recursive -f compact
              
    
    Select_environment:
        name: Select environment
        runs-on: ubuntu-latest
        if : ${{ github.event_name == 'workflow_dispatch' }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
    Extract_environment:
        name: Extract environment
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'pull_request' }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          
    Plan:
        name: Plan
        runs-on: ubuntu-latest
        needs: [Select_environment, Extract_environment]
        if: ${{ always()}}
        steps:
          - name: Tailscale
            uses: tailscale/github-action@v3
            with:
              oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
              oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
              tags: tag:ci
              use-cache: true
          - name: Check connection
            run: ping -c 1 ${{ secrets.TARGET_HOST }}
