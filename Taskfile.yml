version: '3'

includes:
  tf:
    taskfile: "terraform/Taskfile.yml"

vars:
  TF_ENV: '{{.TF_ENV | default "test"}}'
  ANSIBLE_USE_PASSWORDS: '{{.ANSIBLE_USE_PASSWORDS | default "false"}}'
  ANSIBLE_PLAYBOOK: '{{- $map := dict "test" "playbooks/setup-test.yml" "k8s" "playbooks/setup-k8s.yml" -}}{{- if hasKey $map .TF_ENV -}}{{ index $map .TF_ENV }}{{- else -}}playbooks/setup-{{ .TF_ENV }}.yml{{- end -}}'
  ANSIBLE_INVENTORY_FILE: 'inventory/{{.TF_ENV}}.ini'

tasks:
  terraform:init:
    desc: Initialize Terraform for specified environment
    dir: terraform/environments/{{.TF_ENV}}
    cmds:
      - |
        echo "Initializing Terraform for {{.TF_ENV}} environment..."
        terraform init -backend-config="key=proxmox/{{.TF_ENV}}/terraform.tfstate"

  terraform:plan:
    desc: Plan Terraform changes for specified environment
    dir: terraform/environments/{{.TF_ENV}}
    deps:
      - terraform:init
    cmds:
      - |
        echo "Planning Terraform changes for {{.TF_ENV}} environment..."
        terraform plan

  terraform:apply:
    desc: Apply Terraform changes for specified environment
    dir: terraform/environments/{{.TF_ENV}}
    deps:
      - terraform:init
    cmds:
      - |
        echo "Applying Terraform changes for {{.TF_ENV}} environment..."
        terraform apply

  terraform:destroy:
    desc: Destroy Terraform resources for specified environment
    dir: terraform/environments/{{.TF_ENV}}
    cmds:
      - |
        echo "Destroying Terraform resources for {{.TF_ENV}} environment..."
        terraform destroy

  terraform:output:
    desc: Show Terraform outputs for specified environment
    dir: terraform/environments/{{.TF_ENV}}
    cmds:
      - |
        echo "Terraform outputs for {{.TF_ENV}} environment:"
        terraform output

  terraform:output-passwords:
    desc: Show VM passwords (sensitive output)
    dir: terraform/environments/{{.TF_ENV}}
    cmds:
      - |
        echo "VM passwords for {{.TF_ENV}} environment:"
        terraform output vm_passwords

  deploy:
    desc: Complete deployment workflow (Terraform apply + Ansible setup)
    cmds:
      - task: terraform:apply
      - |
        echo "Waiting for VM to be ready..."
        sleep 30
      - task: ansible:setup

  destroy-all:
    desc: Complete cleanup workflow (Terraform destroy)
    cmds:
      - task: terraform:destroy

  ansible:generate-inventory:
    desc: Generate Ansible inventory from Terraform outputs
    dir: terraform/environments/{{.TF_ENV}}
    cmds:
      - |
        echo "Generating Ansible inventory for {{.TF_ENV}} environment..."
        
        # Get outputs from terraform
        VM_INFO=$(terraform output -json vm_connection_info)
        # Only fetch sensitive outputs if explicitly requested
        if [ "{{.ANSIBLE_USE_PASSWORDS}}" = "true" ]; then
          PASSWORDS=$(terraform output -json vm_passwords)
        fi
        CREDENTIALS=$(terraform output -json vm_credentials)
        
        # Create inventory directory and set target file
        mkdir -p ../../../ansible/inventory
        INVENTORY_FILE=../../../ansible/{{.ANSIBLE_INVENTORY_FILE}}

        # Generate environment-specific inventory
        {
          echo "# Generated by task ansible:generate-inventory (env: {{.TF_ENV}})"
          echo "[{{.TF_ENV}}]"
        } > "$INVENTORY_FILE"

        # Extract info for each VM and add to inventory
        echo "$VM_INFO" | jq -r 'keys[]' | while read vm_key; do
          VM_NAME=$(echo "$VM_INFO" | jq -r ".\"$vm_key\".name")
          VM_IP=$(echo "$VM_INFO" | jq -r ".\"$vm_key\".ip_address")
          USERNAME=$(echo "$CREDENTIALS" | jq -r ".\"$vm_key\".username")
          if [ "{{.ANSIBLE_USE_PASSWORDS}}" = "true" ]; then
            PASSWORD=$(echo "$PASSWORDS" | jq -r ".\"$vm_key\"")
            echo "$VM_NAME ansible_host=$VM_IP ansible_user=$USERNAME ansible_password=$PASSWORD ansible_become_password=$PASSWORD" >> "$INVENTORY_FILE"
          else
            echo "$VM_NAME ansible_host=$VM_IP ansible_user=$USERNAME" >> "$INVENTORY_FILE"
          fi
        done

        chmod 0600 "$INVENTORY_FILE"
        echo "Inventory file generated: ansible/{{.ANSIBLE_INVENTORY_FILE}}"



  ansible:run:
    desc: Run Ansible playbook for VM setup
    dir: ansible
    deps:
      - ansible:generate-inventory
    cmds:
      - |
        echo "Running Ansible playbook for {{.TF_ENV}} environment..."
        OPTS=""
        # Remote user (optional)
        if [ -n "${ANSIBLE_REMOTE_USER:-}" ]; then
          OPTS="$OPTS -u $ANSIBLE_REMOTE_USER"
        fi
        # Private key (optional)
        if [ -n "${ANSIBLE_PRIVATE_KEY_FILE:-}" ]; then
          OPTS="$OPTS --private-key $ANSIBLE_PRIVATE_KEY_FILE"
        fi
        # Vault password file (optional)
        if [ -n "${ANSIBLE_VAULT_PASSWORD_FILE:-}" ]; then
          OPTS="$OPTS --vault-password-file $ANSIBLE_VAULT_PASSWORD_FILE"
        elif [ -f ../.vault_pass.txt ]; then
          OPTS="$OPTS --vault-password-file ../.vault_pass.txt"
        fi
        echo "Using inventory: {{.ANSIBLE_INVENTORY_FILE}}"
        echo "Using playbook: {{.ANSIBLE_PLAYBOOK}}"
        ansible-playbook -i {{.ANSIBLE_INVENTORY_FILE}} $OPTS {{.ANSIBLE_PLAYBOOK}}
    
  ansible:setup:
    desc: Generate inventory and run Ansible setup (complete workflow)
    cmds:
      - task: ansible:generate-inventory
      - task: ansible:run

  ansible:test-connection:
    desc: Test Ansible connection to VMs
    dir: ansible
    deps:
      - ansible:generate-inventory
    cmds:
      - |
        echo "Testing Ansible connection for {{.TF_ENV}} environment..."
        OPTS=""
        if [ -n "${ANSIBLE_REMOTE_USER:-}" ]; then
          OPTS="$OPTS -u $ANSIBLE_REMOTE_USER"
        fi
        if [ -n "${ANSIBLE_PRIVATE_KEY_FILE:-}" ]; then
          OPTS="$OPTS --private-key $ANSIBLE_PRIVATE_KEY_FILE"
        fi
        if [ -n "${ANSIBLE_VAULT_PASSWORD_FILE:-}" ]; then
          OPTS="$OPTS --vault-password-file $ANSIBLE_VAULT_PASSWORD_FILE"
        elif [ -f ../.vault_pass.txt ]; then
          OPTS="$OPTS --vault-password-file ../.vault_pass.txt"
        fi
        echo "Using inventory: {{.ANSIBLE_INVENTORY_FILE}}"
        ansible -i {{.ANSIBLE_INVENTORY_FILE}} $OPTS all -m ping

  proxmox:upload-snippet:
    desc: "Copy a snippet (default: password-auth.yml) to Proxmox snippets on target host"
    vars:
      HOST: '{{.HOST | default ""}}'
      SRC: '{{.SRC | default "password-auth.yml"}}'
      DEST: '{{.DEST | default "/var/lib/vz/snippets/password-auth.yml"}}'
    cmds:
      - |
        if [ -z "{{.HOST}}" ]; then
          echo "Usage: task proxmox:upload-snippet HOST=user@host [SRC=password-auth.yml] [DEST=/var/lib/vz/snippets/password-auth.yml]" >&2
          exit 1
        fi
        if [ ! -f "{{.SRC}}" ]; then
          echo "Source file not found: {{.SRC}}" >&2
          exit 1
        fi
        DIR=$(dirname "{{.DEST}}")
        BASENAME=$(basename "{{.DEST}}")
        TMP=/tmp/$BASENAME
        echo "Creating snippets dir on {{.HOST}}: $DIR"
        ssh {{.HOST}} "sudo mkdir -p $DIR"
        echo "Copying {{.SRC}} to {{.HOST}}:$TMP (then sudo mv to {{.DEST}})"
        scp "{{.SRC}}" "{{.HOST}}:$TMP"
        ssh {{.HOST}} "sudo mv $TMP {{.DEST}} && sudo chmod 0644 {{.DEST}}"
        echo "Done. In tfvars, set: cicustom = \"user=<storage_id>:snippets/$(basename {{.DEST}})\""

  ansible:vault-passfile:
    desc: Create local .vault_pass.txt (gitignored)
    cmds:
      - |
        if [ -f .vault_pass.txt ]; then
          echo ".vault_pass.txt already exists (nothing to do)."
          exit 0
        fi
        echo "This creates .vault_pass.txt locally (gitignored)."
        echo "It will be used by ansible-vault and ansible.cfg."
        printf "Enter Vault password: " >&2; stty -echo; IFS= read -r P; stty echo; echo
        printf "Confirm Vault password: " >&2; stty -echo; IFS= read -r C; stty echo; echo
        if [ "$P" != "$C" ]; then
          echo "Passwords do not match." >&2
          exit 1
        fi
        umask 077
        printf "%s\n" "$P" > .vault_pass.txt
        echo ".vault_pass.txt created with 0600 permissions."

  ansible:vault-hostvars-generate:
    desc: Generate per-host encrypted host_vars with ansible-vault from Terraform outputs
    vars:
      TF_ENV: '{{.TF_ENV | default "test"}}'
    dir: terraform/environments/{{.TF_ENV}}
    cmds:
      - |
        if [ ! -f ../../../.vault_pass.txt ]; then
          echo "Vault password file not found: ../../../.vault_pass.txt" >&2
          echo "Run: task ansible:vault-passfile" >&2
          exit 1
        fi
        echo "Generating encrypted host_vars from Terraform outputs for {{.TF_ENV}}..."
        VM_INFO=$(terraform output -json vm_connection_info)
        PASSWORDS=$(terraform output -json vm_passwords)
        CREDENTIALS=$(terraform output -json vm_credentials)
        mkdir -p ../../../ansible/inventory/host_vars
        echo "$VM_INFO" | jq -r 'keys[]' | while read vm_key; do
          VM_NAME=$(echo "$VM_INFO" | jq -r ".\"$vm_key\".name")
          PASSWORD=$(echo "$PASSWORDS" | jq -r ".\"$vm_key\"")
          HV_DIR=../../../ansible/inventory/host_vars/$VM_NAME
          HV_FILE=$HV_DIR/vault.yml
          mkdir -p "$HV_DIR"
          printf '%s\n' \
            "ansible_password: \"$PASSWORD\"" \
            "ansible_become_password: \"$PASSWORD\"" \
            > "$HV_FILE"
          # Encrypt with ansible-vault using local password file
          (cd ../../../ansible && ansible-vault encrypt --vault-password-file ../.vault_pass.txt "inventory/host_vars/$VM_NAME/vault.yml")
          echo "Encrypted: ansible/inventory/host_vars/$VM_NAME/vault.yml"
        done
        echo "Done. Generate inventory without passwords next:"
        echo "ANSIBLE_USE_PASSWORDS=false task ansible:generate-inventory TF_ENV={{.TF_ENV}}"

  ansible:generate-inventory-vault:
    desc: Generate inventory without passwords (for Vault-managed host_vars)
    vars:
      TF_ENV: '{{.TF_ENV | default "test"}}'
    cmds:
      - |
        ANSIBLE_USE_PASSWORDS=false task ansible:generate-inventory TF_ENV={{.TF_ENV}}
