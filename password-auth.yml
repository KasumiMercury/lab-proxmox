#cloud-config

# This snippet enables SSH password authentication and keeps sudo password-required.
# It does not set any plaintext password; Proxmox cloud-init will supply the user
# and its password via ciuser/cipassword (configured by Terraform).

ssh_pwauth: true
disable_root: true

# Notes:
# - Copy this file to your Proxmox snippets storage, e.g.:
#     sudo mkdir -p /var/lib/vz/snippets
#     sudo cp password-auth.yml /var/lib/vz/snippets/password-auth.yml
#     sudo chmod 0644 /var/lib/vz/snippets/password-auth.yml
# - Then set in your environment tfvars (HCL):
#     cicustom = "user=local:snippets/password-auth.yml"
#   Replace 'local' with your storage ID if different.
